<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self' blob:; media-src 'self' blob: data:; manifest-src 'self'; require-trusted-types-for 'script'; trusted-types arthhrms-sanitizer default">
<meta name="referrer" content="no-referrer">
<script src="services/frontendSecurityService.js"></script>
<script src="services/authGuard.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="services/supabaseClient.js"></script>
<script src="services/authService.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go-Live Readiness Center - ARTHHRMS</title>
    <script src="db.js"></script>
    <script src="services/workflowTelemetryService.js"></script>
    <script src="services/auditService.js"></script>
    <script src="services/orchestrationMetricsService.js"></script>
    <script src="services/goLiveValidationService.js"></script>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        :root{--ink:#172033;--muted:#667085;--bg:#f4f6f9;--line:#d8dee8;--nav:#17212f;--blue:#1769aa;--teal:#087f6f;--amber:#a85d00;--red:#b42318;--white:#fff}
        body{font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;letter-spacing:0}
        button,input{font:inherit}.shell{display:grid;grid-template-columns:278px minmax(0,1fr);min-height:100vh}
        aside{background:var(--nav);color:#e7edf5;padding:20px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;align-items:center;gap:11px;padding-bottom:18px;border-bottom:1px solid #344256}.mark{width:40px;height:40px;border-radius:6px;display:grid;place-items:center;background:var(--teal);font-weight:900}.brand h1{font-size:.98rem}.brand p{color:#9fb0c5;font-size:.72rem;margin-top:3px}
        nav{display:grid;gap:5px;margin-top:18px}nav button{border:0;background:transparent;color:#c5d1df;text-align:left;padding:10px 11px;border-radius:6px;cursor:pointer;font-weight:700;font-size:.84rem}nav button:hover,nav button.active{background:#2b394c;color:#fff}
        main{min-width:0;padding:22px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px}.heading h2{font-size:1.45rem}.heading p{color:var(--muted);font-size:.82rem;margin-top:4px}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.actions input{width:150px;border:1px solid var(--line);border-radius:6px;padding:9px;background:#fff}.btn{border:0;border-radius:6px;padding:9px 12px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}.btn.secondary{background:#e4e9f0;color:#243247}.btn.approve{background:var(--teal)}.btn:disabled{opacity:.5;cursor:not-allowed}
        .notice{display:none;border:1px solid #b9d6ef;background:#edf6fc;color:#174f78;padding:10px 12px;border-radius:6px;font-size:.8rem;margin-bottom:12px;white-space:pre-line}.notice.show{display:block}.notice.error{border-color:#f2b8b5;background:#fff0ef;color:#8d1c13}
        .metrics{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}.metric{background:#fff;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:6px;padding:12px;min-width:0}.metric.good{border-left-color:var(--teal)}.metric.warn{border-left-color:var(--amber)}.metric.bad{border-left-color:var(--red)}.metric strong{display:block;font-size:1.28rem;overflow-wrap:anywhere}.metric span{display:block;color:var(--muted);font-size:.67rem;text-transform:uppercase;font-weight:800;margin-top:4px}
        .view{display:none}.view.active{display:block}.band{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px;margin-bottom:14px}.band h3{font-size:1rem;margin-bottom:10px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:6px}table{width:100%;border-collapse:collapse;min-width:780px;background:#fff}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:.77rem;vertical-align:top}th{background:#eef2f6;color:#475467;text-transform:uppercase;font-size:.67rem}tbody tr:last-child td{border-bottom:0}.status{display:inline-block;font-size:.68rem;font-weight:900;padding:3px 6px;border-radius:4px;background:#e8edf3;color:#344054}.status.passed,.status.ready_for_approval,.status.production_ready{background:#dff4ec;color:#056555}.status.failed,.status.blocked,.status.revoked{background:#fee4e2;color:#9d1c16}.status.warning{background:#fff1d6;color:#8b5200}.empty{color:var(--muted)}
        .score-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.score-row{border:1px solid var(--line);border-radius:6px;padding:12px;background:#fff}.score-row b{font-size:1.15rem}.score-row span{display:block;color:var(--muted);font-size:.72rem;margin-top:3px}.certificate{border-left:4px solid var(--teal);background:#f5fbf9;padding:16px}.certificate dl{display:grid;grid-template-columns:180px 1fr;gap:7px;font-size:.78rem}.certificate dt{font-weight:800;color:#475467}.certificate dd{overflow-wrap:anywhere}@media(max-width:1120px){.metrics{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:820px){.shell{grid-template-columns:1fr}aside{height:auto;position:relative}.top{display:block}.actions{justify-content:flex-start;margin-top:12px}.score-grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){main{padding:14px}.metrics,.score-grid{grid-template-columns:1fr}.certificate dl{grid-template-columns:1fr}.actions input,.actions button{width:100%}}
    </style>
</head>
<body>
<div class="shell">
    <aside>
        <div class="brand"><div class="mark">GL</div><div><h1>Go-Live Readiness Center</h1><p>UAT certification control</p></div></div>
        <nav aria-label="Readiness sections">
            <button class="active" data-view="checklist">Checklist</button>
            <button data-view="results">Validation Results</button>
            <button data-view="risks">Risk Analysis</button>
            <button data-view="scores">Scorecards</button>
            <button data-view="certification">Certification</button>
            <button data-view="history">Validation History</button>
        </nav>
    </aside>
    <main>
        <header class="top">
            <div class="heading"><h2>Organization Go-Live Assessment</h2><p id="statusLine">No validation run loaded.</p></div>
            <div class="actions">
                <input id="tenantInput" aria-label="Tenant scope" placeholder="tenant slug">
                <button class="btn secondary" id="refreshBtn">Refresh</button>
                <button class="btn" id="runBtn">Run Validation</button>
                <button class="btn approve" id="approveBtn" disabled>Approve</button>
            </div>
        </header>
        <div class="notice" id="notice" role="status"></div>
        <div class="metrics" id="metrics"></div>

        <section class="view active" id="view-checklist"><div class="band"><h3>Go-Live Checklist</h3><div class="table-wrap"><table id="checklistTable"></table></div></div></section>
        <section class="view" id="view-results"><div class="band"><h3>Validation Results</h3><div class="table-wrap"><table id="resultsTable"></table></div></div></section>
        <section class="view" id="view-risks"><div class="band"><h3>Blocking Issues and Recommendations</h3><div class="table-wrap"><table id="riskTable"></table></div></div></section>
        <section class="view" id="view-scores"><div class="band"><h3>Readiness Scorecards</h3><div class="score-grid" id="scoreGrid"></div></div></section>
        <section class="view" id="view-certification"><div class="band"><h3>Production Certificate</h3><div id="certificateArea" class="certificate empty">No active certificate.</div></div></section>
        <section class="view" id="view-history"><div class="band"><h3>Validation History</h3><div class="table-wrap"><table id="historyTable"></table></div></div></section>
    </main>
</div>
<script>
(function initCenter(){
    'use strict';
    var latestDashboard=null;
    function esc(value){return String(value===null||value===undefined?'':value).replace(/[&<>'"]/g,function(ch){return{'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]})}
    function currentTenant(){var input=document.getElementById('tenantInput').value.trim();if(input)return input;try{var data=DB.get();return data.companySettings&& (data.companySettings.tenantSlug||data.companySettings.tenantId)||'default'}catch(error){return'default'}}
    function currentActor(){try{var user=DB.AuthService&&DB.AuthService.getCurrentUser&&DB.AuthService.getCurrentUser();if(user)return{id:user.id||user.userId||user.empId||'',role:user.role||'UNAUTHENTICATED',tenantSlug:currentTenant()}}catch(error){}return{id:'',role:'UNAUTHENTICATED',tenantSlug:currentTenant()}}
    function context(){return{tenantSlug:currentTenant(),actor:currentActor()}}
    function notice(message,isError){var node=document.getElementById('notice');node.textContent=message||'';node.classList.toggle('show',!!message);node.classList.toggle('error',!!isError)}
    function status(value){var text=String(value||'UNKNOWN');return'<span class="status '+esc(text.toLowerCase())+'">'+esc(text)+'</span>'}
    function table(id,columns,rows){var node=document.getElementById(id);var data=rows||[];node.innerHTML='<thead><tr>'+columns.map(function(c){return'<th>'+esc(c.label)+'</th>'}).join('')+'</tr></thead><tbody>'+(data.length?data.map(function(row){return'<tr>'+columns.map(function(c){return'<td>'+(c.render?c.render(row):esc(row[c.key]))+'</td>'}).join('')+'</tr>'}).join(''):'<tr><td class="empty" colspan="'+columns.length+'">No records.</td></tr>')+'</tbody>'}
    function renderMetrics(d){var scores=d.scorecards||{};var items=[['Overall',d.readinessScore||0,d.readinessScore>=95?'good':d.readinessScore>=80?'warn':'bad'],['Organization',scores.organizationReadiness||0,'good'],['Data Quality',scores.dataQuality||0,'good'],['Security',scores.security||0,'good'],['Infrastructure',scores.infrastructure||0,'good'],['Open Risks',d.blockingIssues&&d.blockingIssues.length||0,d.blockingIssues&&d.blockingIssues.length?'bad':'good']];document.getElementById('metrics').innerHTML=items.map(function(item){return'<div class="metric '+item[2]+'"><strong>'+esc(item[1])+(item[0]==='Open Risks'?'':'%')+'</strong><span>'+esc(item[0])+'</span></div>'}).join('')}
    function renderCertificate(rows){var active=(rows||[]).find(function(row){return row.status!=='REVOKED'});var node=document.getElementById('certificateArea');if(!active){node.className='certificate empty';node.textContent='No active certificate.';return}node.className='certificate';node.innerHTML='<dl><dt>Certification ID</dt><dd>'+esc(active.certificationId)+'</dd><dt>Company</dt><dd>'+esc(active.companyName)+'</dd><dt>Environment</dt><dd>'+esc(active.environment)+'</dd><dt>Readiness Score</dt><dd>'+esc(active.readinessScore)+'%</dd><dt>Validation Date</dt><dd>'+esc(active.validationDate)+'</dd><dt>Certified By</dt><dd>'+esc(active.certifiedBy)+'</dd><dt>Signature Key</dt><dd>'+esc(active.signingKeyId)+'</dd><dt>Status</dt><dd>'+status(active.status||active.certificationStatus)+'</dd></dl>'}
    function render(d){latestDashboard=d;document.getElementById('statusLine').textContent='Status: '+String(d.certificationStatus||'NOT_VALIDATED').replace(/_/g,' ')+' | Tenant: '+d.tenantSlug;document.getElementById('approveBtn').disabled=d.certificationStatus!=='READY_FOR_APPROVAL';renderMetrics(d);table('checklistTable',[{label:'Check',key:'item'},{label:'Status',render:function(row){return status(row.status)}},{label:'Score',render:function(row){return esc(row.score)+'%'}}],d.checklist);table('resultsTable',[{label:'Domain',key:'domain'},{label:'Status',render:function(row){return status(row.status)}},{label:'Score',render:function(row){return esc(row.score)+'%'}},{label:'Failed',key:'failedCount'}],d.validationResults);table('riskTable',[{label:'Domain',key:'domain'},{label:'Severity',render:function(row){return status(row.severity)}},{label:'Issue',key:'summary'},{label:'Recommendation',key:'recommendation'}],d.riskAnalysis&&d.riskAnalysis.risks||[]);var scores=d.scorecards||{};document.getElementById('scoreGrid').innerHTML=[['Organization',scores.organizationReadiness],['Data Quality',scores.dataQuality],['Security',scores.security],['Performance',scores.performance],['Compliance',scores.compliance],['Infrastructure',scores.infrastructure],['Overall',scores.overallReadinessScore]].map(function(row){return'<div class="score-row"><b>'+esc(row[1]||0)+'%</b><span>'+esc(row[0])+'</span></div>'}).join('');renderCertificate(d.certificates);table('historyTable',[{label:'Run ID',key:'runId'},{label:'Status',render:function(row){return status(row.status)}},{label:'Score',render:function(row){return esc(row.readinessScore)+'%'}},{label:'Generated',key:'generatedAt'}],d.validationHistory)}
    function refresh(){var response=GoLiveValidationService.generateDashboard({tenantSlug:currentTenant()},context());if(!response.success){notice(response.message,true);return}notice('');render(response)}
    function run(){notice('Validation in progress...',false);setTimeout(function(){var response=GoLiveValidationService.runValidation({tenantSlug:currentTenant(),mode:'FULL'},context());if(!response.success){notice(response.message,true);return}notice(response.status==='READY_FOR_APPROVAL'?'Validation passed. Administrator approval is required before certificate generation.':'Go-live is blocked. Resolve every required check and run validation again.',response.status==='BLOCKED');refresh()},0)}
    function approve(){if(!latestDashboard||latestDashboard.certificationStatus!=='READY_FOR_APPROVAL')return;var run=latestDashboard.validationHistory&&latestDashboard.validationHistory[0];if(!run)return;if(!globalThis.confirm('Confirm administrator approval for this passing validation run?'))return;var approval=GoLiveValidationService.approveGoLive({tenantSlug:currentTenant(),runId:run.runId,administratorConfirmed:true,reason:'Approved from Go-Live Readiness Center.'},context());if(!approval.success){notice(approval.message,true);return}var certificate=GoLiveValidationService.generateCertificate({tenantSlug:currentTenant(),runId:run.runId,approvalId:approval.approval.approvalId,environment:'PRODUCTION'},context());if(!certificate.success){notice(certificate.message,true);refresh();return}notice('Signed go-live certificate generated.',false);refresh()}
    document.querySelectorAll('nav button').forEach(function(button){button.addEventListener('click',function(){document.querySelectorAll('nav button').forEach(function(node){node.classList.remove('active')});document.querySelectorAll('.view').forEach(function(node){node.classList.remove('active')});button.classList.add('active');document.getElementById('view-'+button.dataset.view).classList.add('active')})});
    document.getElementById('refreshBtn').addEventListener('click',refresh);document.getElementById('runBtn').addEventListener('click',run);document.getElementById('approveBtn').addEventListener('click',approve);
    document.addEventListener('DOMContentLoaded',function(){try{DB.init();DB.migrate()}catch(error){}document.getElementById('tenantInput').value=currentTenant();refresh()});
})();
</script>
</body>
</html>
