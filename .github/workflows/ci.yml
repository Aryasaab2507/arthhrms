name: ArthHRMS CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.17.0
          cache: npm

      - name: Configure Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.8.1

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate Supabase Edge Functions
        run: |
          deno check --frozen --config supabase/functions/invite-user/deno.json supabase/functions/invite-user/index.ts
          deno lint --config supabase/functions/invite-user/deno.json supabase/functions/invite-user/index.ts
          deno check --frozen --config supabase/functions/invite-company-owner/deno.json supabase/functions/invite-company-owner/index.ts
          deno lint --config supabase/functions/invite-company-owner/deno.json supabase/functions/invite-company-owner/index.ts

      - name: Run tests and deployment verification
        run: npm run ci

      - name: Validate production container build
        run: docker build --pull --tag arthhrms:${GITHUB_SHA} .

      - name: Upload deterministic frontend artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arthhrms-frontend-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
