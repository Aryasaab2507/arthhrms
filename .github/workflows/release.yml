name: ArthHRMS Production Release

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY to authorize the production release
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ inputs.confirmation == 'DEPLOY' }}
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.17.0
          cache: npm

      - name: Configure Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.8.1

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run release gates
        run: npm run ci

      - name: Validate Supabase Edge Functions
        run: |
          deno check --frozen --config supabase/functions/invite-user/deno.json supabase/functions/invite-user/index.ts
          deno lint --config supabase/functions/invite-user/deno.json supabase/functions/invite-user/index.ts

      - name: Build immutable release image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/arthhrms"
          docker build --pull --tag "$image:${GITHUB_SHA}" .

      - name: Link production Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Preview database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase db push --linked --include-all --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD"

      - name: Configure exact hosted Auth and CORS origins
        env:
          APP_ORIGIN: ${{ vars.PRODUCTION_APP_ORIGIN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$APP_ORIGIN"
          node scripts/configure-pilot.mjs --apply

      - name: Deploy authenticated invite function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npx supabase functions deploy invite-user --project-ref "$SUPABASE_PROJECT_REF" --use-api

      - name: Authenticate to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Publish immutable release image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/arthhrms"
          docker push "$image:${GITHUB_SHA}"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$image:${GITHUB_SHA}")"
          test -n "$digest"
          echo "### Release artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$digest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Record migration and release evidence
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "### Supabase migration history" >> "$GITHUB_STEP_SUMMARY"
          npx supabase migration list --linked >> "$GITHUB_STEP_SUMMARY"
