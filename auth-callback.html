<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--p:#1a56db;--ink:#0f172a;--muted:#64748b;--bg:#f5f7fb;--card:#fff;--border:#e2e8f0;--r:#dc2626;--g:#059669}
body{font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(135deg,#eef2ff,#f8fafc);min-height:100vh;color:var(--ink);display:grid;place-items:center;padding:22px}
.card{width:min(520px,100%);background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:0 24px 60px rgba(15,23,42,.12);padding:28px;text-align:center}
.mark{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,var(--p),#0ea5e9);color:#fff;display:grid;place-items:center;font-weight:900;margin:0 auto 16px}
h1{font-size:1.35rem;margin-bottom:6px}p{font-size:.88rem;color:var(--muted);line-height:1.55}
.status{margin-top:16px;border-radius:12px;padding:12px;font-size:.84rem;font-weight:800;background:#eff6ff;color:#1d4ed8}.status.err{background:#fee2e2;color:#991b1b}.status.ok{background:#dcfce7;color:#166534}
.btn{display:inline-block;margin-top:16px;border:0;border-radius:9px;padding:10px 14px;background:var(--p);color:#fff;font-weight:900;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <div class="mark">A</div>
  <h1>Activating Your ARTHHRMS Account</h1>
  <p>Please wait while we verify your invitation, link your employee profile, and prepare your dashboard session.</p>
  <div class="status" id="statusBox">Checking invite session...</div>
  <a class="btn" id="fallbackLink" href="ArthHRMS.html" style="display:none">Return to Login</a>
</div>
<script>
async function activate(){
  const box=document.getElementById('statusBox');
  const link=document.getElementById('fallbackLink');
  try{
    const result=await authService.handleAuthCallback({url:location.href});
    if(!result.ok){
      box.textContent=result.error||'Account activation failed.';
      box.className='status err';
      link.style.display='inline-block';
      return;
    }
    box.textContent='Account activated. Redirecting to your dashboard...';
    box.className='status ok';
    setTimeout(()=>{
      const fallback='ArthHRMS.html';
      const candidate=FrontendSecurityService.sanitizeURL(result.redirectTo||fallback);
      let target=fallback;
      try{
        const resolved=new URL(candidate||fallback,location.origin);
        if(resolved.origin===location.origin) target=resolved.href;
      }catch(error){}
      location.href=target;
    },700);
  }catch(err){
    box.textContent=err.message||String(err);
    box.className='status err';
    link.style.display='inline-block';
  }
}
activate();
</script>
</body>
