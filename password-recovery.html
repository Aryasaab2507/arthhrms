<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; require-trusted-types-for 'script'; trusted-types arthhrms-sanitizer default">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Recovery - ArthHRMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="services/frontendSecurityService.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="services/supabaseClient.js"></script>
    <script src="services/errorService.js"></script>
    <script src="services/authService.js"></script>
    <script src="services/passwordRecoveryUI.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            align-items: center;
            background: #f1f5f9;
            color: #0f172a;
            display: flex;
            font-family: 'DM Sans', sans-serif;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .recovery-shell {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.12);
            max-width: 520px;
            padding: 36px;
            width: 100%;
        }

        .brand {
            color: #0f172a;
            font-family: 'Nunito', sans-serif;
            font-size: 1.35rem;
            font-weight: 900;
            margin-bottom: 28px;
        }

        .brand span {
            color: #0284c7;
        }

        h1 {
            font-family: 'Nunito', sans-serif;
            font-size: 1.7rem;
            margin-bottom: 8px;
        }

        .intro {
            color: #475569;
            line-height: 1.55;
            margin-bottom: 26px;
        }

        .recovery-request-form {
            display: grid;
            gap: 16px;
        }

        .field {
            display: grid;
            gap: 7px;
        }

        .field label {
            font-size: 0.9rem;
            font-weight: 700;
        }

        .input {
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            font: inherit;
            padding: 12px 14px;
            width: 100%;
        }

        .input:focus {
            border-color: #0369a1;
            outline: 2px solid transparent;
        }

        .recovery-guidance {
            color: #64748b;
            font-size: 0.84rem;
            line-height: 1.5;
        }

        .btn {
            background: #0369a1;
            border: 0;
            border-radius: 6px;
            color: #ffffff;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
            padding: 13px 16px;
            width: 100%;
        }

        .btn:hover {
            background: #075985;
        }

        .btn:disabled {
            cursor: not-allowed;
            opacity: 0.65;
        }

        .form-feedback {
            font-size: 0.88rem;
            font-weight: 600;
            line-height: 1.45;
            min-height: 20px;
        }

        .form-feedback.err {
            color: #991b1b;
        }

        .form-feedback.ok {
            color: #166534;
        }

        .return-link {
            color: #075985;
            display: inline-block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-top: 24px;
            text-decoration: none;
        }

        .return-link:hover,
        .return-link:focus-visible {
            text-decoration: underline;
        }

        @media (max-width: 560px) {
            body {
                align-items: flex-start;
                padding: 12px;
            }

            .recovery-shell {
                padding: 28px 22px;
            }
        }
    </style>
</head>
<body>
    <main class="recovery-shell">
        <div class="brand">Arth<span>HRMS</span></div>
        <h1>Password Recovery</h1>
        <p class="intro">Enter your account email to request a secure password reset link.</p>
        <div id="recoveryRequestMount"></div>
        <a class="return-link" id="returnToLogin" href="ArthHRMS.html">Return to Login</a>
    </main>

    <script>
        (function initializePasswordRecovery() {
            const source = new URLSearchParams(window.location.search).get('source');
            const returnLink = document.getElementById('returnToLogin');
            if (source === 'platform') {
                returnLink.href = 'platform-login.html';
                returnLink.textContent = 'Return to Platform Login';
            }

            PasswordRecoveryUI.mountRequest({
                container: '#recoveryRequestMount',
                onSubmit: (email) => authService.requestPasswordRecovery(email)
            });
        })();
    </script>
</body>
</html>
