    <meta charset="UTF-8">

    <style>
        *{box-sizing:border-box;margin:0;padding:0}:root{--ink:#192230;--muted:#667085;--bg:#f4f6f8;--line:#d8dee6;--nav:#16202c;--blue:#1769aa;--green:#087f5b;--amber:#a15c00;--red:#b42318;--white:#fff}body{font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;letter-spacing:0}button,input,select{font:inherit}.shell{display:grid;grid-template-columns:276px minmax(0,1fr);min-height:100vh}aside{background:var(--nav);color:#e7edf4;padding:20px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;align-items:center;gap:11px;padding-bottom:18px;border-bottom:1px solid #344254}.mark{width:40px;height:40px;border-radius:6px;background:var(--green);display:grid;place-items:center;font-weight:900}.brand h1{font-size:1rem}.brand p{color:#9fb0c3;font-size:.72rem;margin-top:3px}nav{display:grid;gap:5px;margin-top:18px}nav button{border:0;background:transparent;color:#c7d2df;text-align:left;padding:10px 11px;border-radius:6px;cursor:pointer;font-weight:750;font-size:.84rem}nav button:hover,nav button.active{background:#2b394b;color:#fff}main{padding:22px;min-width:0}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:15px}.heading h2{font-size:1.42rem}.heading p{font-size:.8rem;color:var(--muted);margin-top:4px}.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.actions input{width:135px;border:1px solid var(--line);border-radius:6px;padding:9px;background:#fff}.btn{border:0;border-radius:6px;padding:9px 11px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}.btn.secondary{background:#e3e8ee;color:#233247}.btn.good{background:var(--green)}.btn.warn{background:var(--amber)}.btn.danger{background:var(--red)}.btn:disabled{opacity:.45;cursor:not-allowed}.notice{display:none;border:1px solid #b9d6ef;background:#edf6fc;color:#174f78;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:.8rem;white-space:pre-line}.notice.show{display:block}.notice.error{border-color:#efb4b0;background:#fff0ef;color:#8e1b13}.metrics{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}.metric{background:#fff;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:6px;padding:12px}.metric.good{border-left-color:var(--green)}.metric.warn{border-left-color:var(--amber)}.metric.bad{border-left-color:var(--red)}.metric strong{display:block;font-size:1.25rem}.metric span{display:block;color:var(--muted);font-size:.66rem;text-transform:uppercase;font-weight:850;margin-top:4px}.view{display:none}.view.active{display:block}.band{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px;margin-bottom:14px}.band h3{font-size:1rem;margin-bottom:10px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:6px}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:9px;border-bottom:1px solid var(--line);font-size:.76rem;text-align:left;vertical-align:top}th{background:#eef2f6;color:#475467;text-transform:uppercase;font-size:.66rem}tbody tr:last-child td{border-bottom:0}.tag{display:inline-block;padding:3px 6px;border-radius:4px;background:#e7ecf2;color:#344054;font-size:.67rem;font-weight:900}.tag.passed,.tag.completed,.tag.signed{background:#dff4e9;color:#05603f}.tag.failed,.tag.blocked,.tag.cancelled{background:#fee4e2;color:#9b1c16}.tag.running{background:#e4f0fb;color:#175b8d}.tag.paused,.tag.skipped{background:#fff1d6;color:#855000}.row-btn{border:1px solid var(--line);background:#fff;border-radius:5px;padding:5px 7px;cursor:pointer;font-size:.7rem;font-weight:800;margin-right:4px}.score-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.score{border:1px solid var(--line);border-radius:6px;padding:12px}.score b{font-size:1.15rem}.score span{display:block;color:var(--muted);font-size:.7rem;margin-top:3px}.empty{color:var(--muted)}@media(max-width:1120px){.metrics{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:820px){.shell{grid-template-columns:1fr}aside{position:relative;height:auto}.top{display:block}.actions{justify-content:flex-start;margin-top:12px}.score-grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){main{padding:14px}.metrics,.score-grid{grid-template-columns:1fr}.actions input,.actions button{width:100%}}
    </style>
</head>
<body>
<div class="shell">
    <aside><div class="brand"><div class="mark">UT</div><div><h1>HR UAT Center</h1><p>Operational acceptance control</p></div></div><nav aria-label="UAT sections"><button class="active" data-view="execution">Execution</button><button data-view="cases">Test Cases</button><button data-view="issues">Issues</button><button data-view="evidence">Evidence</button><button data-view="signoffs">Sign-offs</button><button data-view="analytics">Analytics</button><button data-view="history">History</button></nav></aside>
    <main>
        <header class="top"><div class="heading"><h2>HR User Acceptance Testing</h2><p id="statusLine">No execution selected.</p></div><div class="actions"><input id="tenantInput" aria-label="Tenant scope" placeholder="tenant slug"><button class="btn secondary" id="libraryBtn">Initialize Library</button><button class="btn" id="startBtn">Start Run</button><button class="btn secondary" id="refreshBtn">Refresh</button></div></header>
        <div class="notice" id="notice" role="status"></div><div class="metrics" id="metrics"></div>
        <section class="view active" id="view-execution"><div class="band"><h3>Execution Control</h3><div class="actions" style="justify-content:flex-start;margin-bottom:10px"><button class="btn warn" id="pauseBtn" disabled>Pause</button><button class="btn good" id="resumeBtn" disabled>Resume</button><button class="btn good" id="completeBtn" disabled>Complete</button><button class="btn danger" id="cancelBtn" disabled>Cancel</button><button class="btn secondary" id="reportBtn" disabled>Queue Report</button></div><div class="table-wrap"><table id="executionTable"></table></div></div></section>
        <section class="view" id="view-cases"><div class="band"><h3>Test Case Execution</h3><div class="table-wrap"><table id="casesTable"></table></div></div></section>
        <section class="view" id="view-issues"><div class="band"><h3>Issue Tracking</h3><div class="table-wrap"><table id="issuesTable"></table></div></div></section>
        <section class="view" id="view-evidence"><div class="band"><h3>Evidence</h3><div class="table-wrap"><table id="evidenceTable"></table></div></div></section>
        <section class="view" id="view-signoffs"><div class="band"><h3>HR Sign-offs</h3><div class="actions" style="justify-content:flex-start;margin-bottom:10px"><button class="btn good" id="signoffBtn" disabled>Record My Sign-off</button></div><div class="table-wrap"><table id="signoffsTable"></table></div></div></section>
        <section class="view" id="view-analytics"><div class="band"><h3>UAT Analytics</h3><div class="score-grid" id="scoreGrid"></div><div class="table-wrap" style="margin-top:12px"><table id="moduleTable"></table></div></div></section>
        <section class="view" id="view-history"><div class="band"><h3>Execution History</h3><div class="table-wrap"><table id="historyTable"></table></div></div></section>
    </main>
</div>
<script>
(function(){'use strict';var dashboard=null;function esc(value){return String(value===null||value===undefined?'':value).replace(/[&<>'"]/g,function(ch){return{'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]})}function tenant(){var value=document.getElementById('tenantInput').value.trim();if(value)return value;try{var data=DB.get();return data.companySettings&&(data.companySettings.tenantSlug||data.companySettings.tenantId)||'default'}catch(error){return'default'}}function user(){try{var row=DB.AuthService&&DB.AuthService.getCurrentUser&&DB.AuthService.getCurrentUser();if(row)return{id:row.id||row.empId||'CURRENT',role:row.role||'EMPLOYEE',tenantSlug:tenant()}}catch(error){}return{id:'HR-HEAD',role:'HR_HEAD',tenantSlug:tenant()}}function context(){return{tenantSlug:tenant(),actor:user()}}function note(message,error){var node=document.getElementById('notice');node.textContent=message||'';node.classList.toggle('show',!!message);node.classList.toggle('error',!!error)}function tag(value){var text=String(value||'UNKNOWN');return'<span class="tag '+esc(text.toLowerCase())+'">'+esc(text)+'</span>'}function table(id,columns,rows){var node=document.getElementById(id);var data=rows||[];node.innerHTML='<thead><tr>'+columns.map(function(c){return'<th>'+esc(c.label)+'</th>'}).join('')+'</tr></thead><tbody>'+(data.length?data.map(function(row){return'<tr>'+columns.map(function(c){return'<td>'+(c.render?c.render(row):esc(row[c.key]))+'</td>'}).join('')+'</tr>'}).join(''):'<tr><td class="empty" colspan="'+columns.length+'">No records.</td></tr>')+'</tbody>'}function controls(active){var state=active&&active.status||'';document.getElementById('pauseBtn').disabled=state!=='RUNNING';document.getElementById('resumeBtn').disabled=state!=='PAUSED';document.getElementById('completeBtn').disabled=state!=='RUNNING';document.getElementById('cancelBtn').disabled=!['RUNNING','PAUSED'].includes(state);document.getElementById('reportBtn').disabled=!active;document.getElementById('signoffBtn').disabled=!active||state!=='COMPLETED'||active.outcome!=='PASSED'}function render(d){dashboard=d;var active=d.activeExecution;var a=d.analytics||{matrix:{}};document.getElementById('statusLine').textContent=active?'Run '+active.executionId+' | '+active.status+' | Manifest '+active.manifestFingerprint:'No execution selected for '+d.tenantSlug;controls(active);var matrix=a.matrix||{};var items=[['Progress',(d.executionProgress||0)+'%',d.executionProgress===100?'good':'warn'],['Passed',matrix.passed||0,'good'],['Failed',matrix.failed||0,matrix.failed?'bad':'good'],['Blocked',matrix.blocked||0,matrix.blocked?'bad':'good'],['Open Issues',(d.issues||[]).filter(function(row){return!['RESOLVED','CLOSED'].includes(row.resolutionStatus)}).length,'warn'],['HR Readiness',(a.hrReadinessScore||0)+'%',a.hrReadinessScore===100?'good':'warn']];document.getElementById('metrics').innerHTML=items.map(function(item){return'<div class="metric '+item[2]+'"><strong>'+esc(item[1])+'</strong><span>'+esc(item[0])+'</span></div>'}).join('');table('executionTable',[{label:'Run',key:'executionId'},{label:'Name',key:'name'},{label:'Status',render:function(row){return tag(row.status)}},{label:'Outcome',render:function(row){return row.outcome?tag(row.outcome):''}},{label:'Version',key:'version'},{label:'Started',key:'startedAt'}],active?[active]:[]);table('casesTable',[{label:'Test ID',key:'testId'},{label:'Module',key:'module'},{label:'Description',key:'description'},{label:'Priority',render:function(row){return tag(row.priority)}},{label:'Status',render:function(row){return tag(row.status)}},{label:'Actions',render:function(row){return'<button class="row-btn" onclick="recordCase(\''+esc(row.testId)+'\',\'PASSED\')">Pass</button><button class="row-btn" onclick="recordCase(\''+esc(row.testId)+'\',\'FAILED\')">Fail</button><button class="row-btn" onclick="addComment(\''+esc(row.testId)+'\')">Evidence</button><button class="row-btn" onclick="addBug(\''+esc(row.testId)+'\')">Bug</button>'}}],d.testCases||[]);table('issuesTable',[{label:'Bug',key:'issueId'},{label:'Title',key:'title'},{label:'Module',key:'module'},{label:'Severity',render:function(row){return tag(row.severity)}},{label:'Status',render:function(row){return tag(row.resolutionStatus)}}],d.issues||[]);table('evidenceTable',[{label:'Evidence',key:'evidenceId'},{label:'Test',key:'testId'},{label:'Type',render:function(row){return tag(row.evidenceType)}},{label:'Title',key:'title'},{label:'Fingerprint',key:'fingerprint'},{label:'Uploaded',key:'uploadedAt'}],d.evidence||[]);table('signoffsTable',[{label:'Stage',key:'stage'},{label:'Signer',key:'signerId'},{label:'Status',render:function(row){return tag(row.status)}},{label:'Timestamp',key:'timestamp'},{label:'Signing Key',key:'signingKeyId'}],d.signoffs||[]);document.getElementById('scoreGrid').innerHTML=[['Execution Progress',a.executionProgress],['Pass Rate',a.passRate],['Bug Density',a.bugDensity],['Retest Rate',a.retestRate],['HR Readiness',a.hrReadinessScore],['Critical Issues',a.openCriticalIssues]].map(function(row){return'<div class="score"><b>'+esc(row[1]||0)+(row[0].includes('Rate')||row[0].includes('Progress')||row[0].includes('Readiness')?'%':'')+'</b><span>'+esc(row[0])+'</span></div>'}).join('');table('moduleTable',[{label:'Module',key:'module'},{label:'Cases',key:'total'},{label:'Passed',key:'passed'},{label:'Failed',key:'failed'},{label:'Stability',render:function(row){return esc(row.stabilityScore)+'%'}}],a.moduleStability||[]);table('historyTable',[{label:'Run',key:'executionId'},{label:'Name',key:'name'},{label:'Status',render:function(row){return tag(row.status)}},{label:'Outcome',render:function(row){return row.outcome?tag(row.outcome):''}},{label:'Started',key:'startedAt'},{label:'Fingerprint',key:'manifestFingerprint'}],d.executionHistory||[])}function refresh(){var response=HRUATService.generateDashboard({tenantSlug:tenant(),executionId:dashboard&&dashboard.activeExecution&&dashboard.activeExecution.executionId},context());if(!response.success){note(response.message,true);return}note('');render(response)}function active(){return dashboard&&dashboard.activeExecution}window.recordCase=function(testId,status){if(!active()||active().status!=='RUNNING')return note('Start or resume a run before recording results.',true);var actual=prompt('Actual result');if(!actual)return;var response=HRUATService.recordTestResult({tenantSlug:tenant(),executionId:active().executionId,testId:testId,status:status,actualResult:actual,expectedVersion:active().version,retest:true},context());note(response.message,!response.success);refresh()};window.addComment=function(testId){if(!active())return;var comment=prompt('Evidence comment');if(!comment)return;var response=HRUATService.addEvidence({tenantSlug:tenant(),executionId:active().executionId,testId:testId,evidenceType:'COMMENT',comment:comment,title:'HR UAT comment'},context());note(response.message,!response.success);refresh()};window.addBug=function(testId){if(!active())return;var title=prompt('Bug title');if(!title)return;var steps=prompt('Steps to reproduce');if(!steps)return;var response=HRUATService.createIssue({tenantSlug:tenant(),executionId:active().executionId,testId:testId,title:title,stepsToReproduce:steps,severity:'HIGH',priority:'HIGH'},context());note(response.message,!response.success);refresh()};function transition(method){if(!active())return;var response=HRUATService[method]({tenantSlug:tenant(),executionId:active().executionId,expectedVersion:active().version,reason:'HR UAT Center action.'},context());note(response.message,!response.success);refresh()}function sign(){if(!active()||!confirm('Confirm digital HR sign-off for this completed execution?'))return;var stage=String(user().role||'').toUpperCase();var response=HRUATService.signoff({tenantSlug:tenant(),executionId:active().executionId,stage:stage,confirmed:true,remarks:'Signed from HR UAT Center.'},context());note(response.message,!response.success);refresh()}document.querySelectorAll('nav button').forEach(function(button){button.addEventListener('click',function(){document.querySelectorAll('nav button').forEach(function(node){node.classList.remove('active')});document.querySelectorAll('.view').forEach(function(node){node.classList.remove('active')});button.classList.add('active');document.getElementById('view-'+button.dataset.view).classList.add('active')})});document.getElementById('libraryBtn').onclick=function(){var response=HRUATService.initializeLibrary({tenantSlug:tenant()},context());note(response.message,!response.success);refresh()};document.getElementById('startBtn').onclick=function(){var response=HRUATService.startExecution({tenantSlug:tenant(),name:'HR UAT '+new Date().toLocaleDateString()},context());note(response.message,!response.success);refresh()};document.getElementById('refreshBtn').onclick=refresh;document.getElementById('pauseBtn').onclick=function(){transition('pauseExecution')};document.getElementById('resumeBtn').onclick=function(){transition('resumeExecution')};document.getElementById('completeBtn').onclick=function(){transition('completeExecution')};document.getElementById('cancelBtn').onclick=function(){if(confirm('Cancel this UAT execution?'))transition('cancelExecution')};document.getElementById('reportBtn').onclick=function(){if(!active())return;var response=HRUATService.scheduleBackgroundReport({tenantSlug:tenant(),executionId:active().executionId},context());note(response.message,!response.success)};document.getElementById('signoffBtn').onclick=sign;document.addEventListener('DOMContentLoaded',function(){try{DB.init();DB.migrate()}catch(error){}document.getElementById('tenantInput').value=tenant();refresh()})})();
</script>
</body>
